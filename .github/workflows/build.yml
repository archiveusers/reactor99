name: Build REACTOR 99 (Windows VST3)

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Find project
        shell: pwsh
        run: |
          $cm = Get-ChildItem -Recurse -Filter CMakeLists.txt | Select-Object -First 1
          if (-not $cm) { Write-Error "CMakeLists.txt not found anywhere in the repo"; exit 1 }
          "SRC=$($cm.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Found project at $($cm.DirectoryName)"

      - name: Configure
        run: cmake -S "$env:SRC" -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target Reactor99_VST3 --parallel

      - name: Collect plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $vst = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1
          Copy-Item $vst.FullName -Destination dist -Recurse

      - uses: actions/upload-artifact@v4
        with:
          name: REACTOR99-VST3-Windows
          path: dist
