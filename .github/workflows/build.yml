name: Build REACTOR 99 (Windows VST3)

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target Reactor99_VST3 --parallel

      - name: Collect plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $vst = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1
          Copy-Item $vst.FullName -Destination dist -Recurse
          Get-ChildItem -Path dist -Recurse | Select-Object FullName

      - uses: actions/upload-artifact@v4
        with:
          name: REACTOR99-VST3-Windows
          path: dist
